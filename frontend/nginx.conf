server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API se sirve bajo el mismo origen que la SPA. Dos motivos:
    #
    #   1. Evita CORS: el navegador nunca cruza de origen, así que el
    #      backend no necesita cabeceras Access-Control-*.
    #   2. Deja libre el espacio de rutas de la SPA. /jobs/:id es una
    #      vista de la aplicación, no un endpoint; si el proxy tomara
    #      /jobs directamente, abrir esa URL devolvería JSON en vez de
    #      la aplicación.
    #
    # La barra final de proxy_pass elimina el prefijo /api, de modo que
    # /api/auth/login llega al backend como /auth/login.
    location /api/ {
        proxy_pass http://api:8080/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un bundle grande puede tardar en transferirse.
        proxy_read_timeout 300s;

        # El backend rechaza subidas de más de 10 MB con su propio
        # mensaje. El margen evita que nginx se adelante con un 413 en
        # HTML, que es justo el tipo de respuesta que el frontend no
        # sabe interpretar.
        client_max_body_size 12m;
    }

    # Cualquier otra ruta es de la SPA: se sirve index.html para que
    # recargar en una vista profunda no acabe en el 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
